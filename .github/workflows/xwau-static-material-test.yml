name: XWAU-004 static material contracts

on:
  push:
    branches:
      - xwau-004-static-materials
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/xwa_remaster/opt_mesh.c'
      - 'src/xwa_remaster/xwau_material.c'
      - 'src/xwa_remaster/xwau_material.h'
      - 'src/xwa_remaster/xwau_material_asset.c'
      - 'src/xwa_remaster/xwau_material_asset.h'
      - 'src/xwa_remaster/xwau_material_render.c'
      - 'src/xwa_remaster/xwau_material_render.h'
      - 'src/xwa_remaster/xwau_normal_map.c'
      - 'src/xwa_remaster/xwau_normal_map.h'
      - 'src/xwa_remaster/xwau_opt_materials.c'
      - 'src/xwa_remaster/xwau_opt_materials.h'
      - 'tests/xwau_static_material_test.c'
      - 'tests/xwau_material_asset_test.c'
      - 'tests/xwau_material_render_test.c'
      - 'tests/xwau_normal_map_test.c'
      - 'tests/xwau_opt_material_integration_test.c'
      - '.github/workflows/xwau-static-material-test.yml'

jobs:
  focused:
    name: focused static material contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build parser contract
        shell: bash
        run: |
          cc -std=c99 -Wall -Wextra -Wpedantic \
            -Isrc \
            tests/xwau_static_material_test.c \
            src/xwa_remaster/xwau_material.c \
            -lm \
            -o xwau_static_material_test

      - name: Run parser contract
        shell: bash
        run: ./xwau_static_material_test

      - name: Build asset lookup RED contract
        shell: bash
        run: |
          cc -std=c99 -Wall -Wextra -Wpedantic \
            -Isrc -Iaeron/include \
            tests/xwau_material_asset_test.c \
            src/xwa_remaster/xwau_material.c \
            src/xwa_remaster/xwau_material_asset.c \
            -lm \
            -o xwau_material_asset_test

      - name: Run asset lookup contract
        shell: bash
        run: ./xwau_material_asset_test

      - name: Build material render RED contract
        shell: bash
        run: |
          cc -std=c99 -Wall -Wextra -Wpedantic \
            -Isrc -Iaeron/include \
            tests/xwau_material_render_test.c \
            src/xwa_remaster/xwau_material_render.c \
            -lm \
            -o xwau_material_render_test

      - name: Run material render contract
        shell: bash
        run: ./xwau_material_render_test

      - name: Build DAT normal-map RED contract
        shell: bash
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Isrc -Isrc/xwa_formats/xwa_2d -Iaeron/include \
            -Ithird_party/lzma_sdk -Ithird_party/bcdec \
            tests/xwau_normal_map_test.c \
            src/xwa_remaster/xwau_normal_map.c \
            src/xwa_formats/xwa_2d/xwa_2d.c \
            src/xwa_formats/xwa_2d/xwa_dat.c \
            third_party/lzma_sdk/LzmaDec.c \
            -o xwau_normal_map_test

      - name: Run DAT normal-map contract
        shell: bash
        run: ./xwau_normal_map_test

      - name: Build OPT material integration RED contract
        shell: bash
        run: |
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -DNDEBUG \
            -Isrc -Iaeron/include \
            tests/xwau_opt_material_integration_test.c \
            src/xwa_remaster/opt_mesh.c \
            src/xwa_remaster/xwau_opt_materials.c \
            -lm \
            -o xwau_opt_material_integration_test

      - name: Run OPT material integration contract
        shell: bash
        run: ./xwau_opt_material_integration_test
