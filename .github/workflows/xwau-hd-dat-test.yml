name: XWAU HD DAT Resolution Test

on:
  push:
    branches:
      - xwau-003-hd-dat-resolution
  workflow_dispatch:

jobs:
  hd-dat-resolution:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compilar test HD DAT
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Isrc \
            -Isrc/xwa_formats/xwa_2d \
            -Iaeron/include \
            -Ithird_party/lzma_sdk \
            -Ithird_party/bcdec \
            tests/xwau_hd_dat_resolution_test.c \
            src/xwa_remaster/original_2d.c \
            src/xwa_formats/xwa_2d/xwa_2d.c \
            src/xwa_formats/xwa_2d/xwa_dat.c \
            src/xwa_formats/xwa_2d/xwa_flc.c \
            src/xwa_formats/xwa_2d/xwa_font.c \
            src/xwa_formats/xwa_2d/xwa_frontend_image.c \
            third_party/lzma_sdk/LzmaDec.c \
            -lm \
            -o xwau_hd_dat_resolution_test

      - name: Ejecutar test HD DAT
        run: ./xwau_hd_dat_resolution_test
