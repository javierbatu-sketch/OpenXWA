name: XWAU HD texture and cockpit contracts

on:
  push:
    branches:
      - xwau-004-static-materials
  pull_request:
    paths:
      - 'src/xwa/assets/opt_model.c'
      - 'src/xwa/flight/fediskio.c'
      - 'tests/xwau_hd_texture_cockpit_contract_test.py'
      - '.github/workflows/xwau-hd-texture-cockpit-test.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run XWAU HD texture and cockpit contracts
        run: python3 tests/xwau_hd_texture_cockpit_contract_test.py
