name: XWAU DAT Extended Test

on:
  push:
    branches:
      - xwau-002-dat-codecs
  workflow_dispatch:

jobs:
  raw-bgra:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compilar test DAT
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Isrc/xwa_formats/xwa_2d \
            -Ithird_party/lzma_sdk \
            -Ithird_party/bcdec \
            tests/xwau_dat_extended_test.c \
            src/xwa_formats/xwa_2d/xwa_dat.c \
            third_party/lzma_sdk/LzmaDec.c \
            -o xwau_dat_extended_test

      - name: Ejecutar test DAT
        run: ./xwau_dat_extended_test