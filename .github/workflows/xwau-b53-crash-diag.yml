name: XWAU B5.3 crash diagnostic

on:
  push:
    branches:
      - xwau-b5.3-crash-diag

concurrency:
  group: xwau-b53-crash-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Release diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Windows package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/windows/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XWA_BUILD_TYPE=Release
            XWA_VERSION=${{ steps.sha.outputs.short }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=windows

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-b53-crash-diag-windows-x86_64-release
          path: build/artifacts/*.zip
          if-no-files-found: error
